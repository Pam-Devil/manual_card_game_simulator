<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cardgame</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <game>

        <top-bar>
            <game-name>Cardgame</game-name>

            <game-info>
                <turn>Seu turno</turn>
                <turn-number>Turno 4</turn-number>
            </game-info>
        </top-bar>


        <action-menu popover>
            <action data-action="move">Mover</action>
            <action data-action="target">Alvejar</action>
            <action data-action="attack">Atacar</action>
            <action data-action="declare">Declarar</action>
            <action data-action="flip">Virar</action>
            <action data-action="to_top_deck">Para T. Deck</action>
            <action data-action="to_bot_deck">Para F. Deck</action>
            <action data-action="to_hand">Para a Mão</action>
            <action data-action="to_backstage">Para Backstage</action>
            <action data-action="add_token">Elemental Token</action>
        </action-menu>

        <game-board>

            <opponent-side>

                <player-info>
                    <player-name>Player 2</player-name>
                    <energy>⚡ <span id="player-2-energy">3</span></energy>
                </player-info>

                <game-field data-player="2">
                    <card-slot data-slot="0"></card-slot>
                    <card-slot data-slot="1"></card-slot>
                    <card-slot data-slot="2"></card-slot>
                    <card-slot data-slot="3"></card-slot>
                    <card-slot data-slot="4"></card-slot>
                </game-field>

                <deck data-count="27">
                    <span>DECK</span>
                </deck>

            </opponent-side>


            <backstage-zone>
                <zone-name>BACKSTAGE</zone-name>
            </backstage-zone>


            <player-side>

                <player-info>
                    <player-name>Player 1</player-name>
                    <energy>⚡ <span id="player-1-energy">5</span></energy>
                </player-info>

                <game-field data-player="1">
                    <card-slot data-slot="0"></card-slot>
                    <card-slot data-slot="1"></card-slot>
                    <card-slot data-slot="2"></card-slot>
                    <card-slot data-slot="3"></card-slot>
                    <card-slot data-slot="4"></card-slot>
                </game-field>

                <deck data-count="31">
                    <span>DECK</span>
                </deck>

            </player-side>


            <player-hand>
                <card></card>
                <card></card>
                <card></card>
                <card></card>

            </player-hand>


            <board-overlay></board-overlay>

        </game-board>


        <side-panel>

            <panel-tabs>
                <button class="active">Chat</button>
                <button>Log</button>
                <button>Ações</button>
            </panel-tabs>

            <panel-content>
                <p>Game log / chat</p>
            </panel-content>

        </side-panel>


        <toolbar>

            <button>↶</button>
            <button>↷</button>

            <button>Shuffle</button>
            <button>Flip</button>
            <button>Rotate</button>
            <button data-action="switch_players">switch</button>

            <toolbar-spacer></toolbar-spacer>

            <button>Pass Turn</button>

        </toolbar>

    </game>
    <script src="./main.js" type="module"></script>
</body>

</html>
